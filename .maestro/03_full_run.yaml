appId: com.howe.diskmark
name: Run all four tests and switch units
tags: [smoke]
---
# No clearState: some OEM ROMs (e.g. ColorOS) forbid `pm clear` over adb, and the app keeps no persisted state.
- launchApp:
    stopApp: true
- runFlow: subflows/quick_settings.yaml
# The progress bar animates constantly, so don't wait for the UI to settle.
- tapOn:
    id: btn_all
    waitToSettleTimeoutMs: 500
- assertVisible: { text: "Stop", childOf: { id: btn_all } }
- extendedWaitUntil:
    visible: { id: status, text: "Done" }
    timeout: 120000
- assertVisible: { text: "All", childOf: { id: btn_all } }
- assertNotVisible: { id: read_seq1m_q8t1, text: "0.00" }
- assertNotVisible: { id: write_seq1m_q8t1, text: "0.00" }
- assertNotVisible: { id: read_rnd4k_q32t1, text: "0.00" }
- assertNotVisible: { id: write_rnd4k_q32t1, text: "0.00" }
- assertNotVisible: { id: read_rnd4k_q1t1, text: "0.00" }
- assertNotVisible: { id: write_rnd4k_q1t1, text: "0.00" }
- takeScreenshot: 03_full_run_mbs
- tapOn: { id: select_unit }
- tapOn: { id: option_unit_IOPS }
- assertVisible: "Read (IOPS)"
- takeScreenshot: 03_full_run_iops
