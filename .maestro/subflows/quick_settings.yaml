# Subflow: shrink the benchmark so automated runs finish quickly.
appId: com.howe.diskmark
---
- tapOn: { id: select_count }
- tapOn: { id: option_count_1 }
- tapOn: { id: select_size }
- tapOn: { id: option_size_64 }
- tapOn: { id: select_duration }
- tapOn: { id: option_duration_1 }
- assertVisible: { text: "1×", childOf: { id: select_count } }
- assertVisible: { text: "64MiB", childOf: { id: select_size } }
- assertVisible: { text: "1s", childOf: { id: select_duration } }
