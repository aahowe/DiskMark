appId: com.howe.diskmark
name: Launch shows all CrystalDiskMark rows
tags: [smoke]
---
# No clearState: some OEM ROMs (e.g. ColorOS) forbid `pm clear` over adb, and the app keeps no persisted state.
- launchApp:
    stopApp: true
- assertVisible: "DiskMark"
- assertVisible: { text: "All", childOf: { id: btn_all } }
- assertVisible: "Read (MB/s)"
- assertVisible: "Write (MB/s)"
- assertVisible: "SEQ1M"
- assertVisible: "RND4K"
- assertVisible: "Q8T1"
- assertVisible: "Q32T1"
- assertVisible: { id: status, text: "Ready" }
- takeScreenshot: 01_launch
