appId: com.howe.diskmark
name: Stop a running benchmark
tags: [smoke]
---
- launchApp:
    clearState: true
- tapOn: { id: btn_all }
- extendedWaitUntil:
    visible: { id: status, text: "SEQ1M Q8T1 Read.*" }
    timeout: 60000
- tapOn: { text: "Stop", childOf: { id: btn_all } }
- extendedWaitUntil:
    visible: { id: status, text: "Cancelled" }
    timeout: 15000
- assertVisible: { text: "All", childOf: { id: btn_all } }
- takeScreenshot: 04_cancel
