appId: com.howe.diskmark
name: Run a single SEQ1M Q1T1 test
tags: [smoke]
---
- launchApp:
    clearState: true
- runFlow: subflows/quick_settings.yaml
- tapOn: { id: btn_seq1m_q1t1 }
- extendedWaitUntil:
    visible: { id: status, text: "Done" }
    timeout: 60000
- assertNotVisible: { id: read_seq1m_q1t1, text: "0.00" }
- assertNotVisible: { id: write_seq1m_q1t1, text: "0.00" }
# Other rows must stay untouched
- assertVisible: { id: read_rnd4k_q1t1, text: "0.00" }
- assertVisible: { id: device_info, text: ".*O_DIRECT.*" }
- takeScreenshot: 02_single_test
